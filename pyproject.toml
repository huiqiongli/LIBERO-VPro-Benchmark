[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libero-vpro-release"
version = "0.1.0"
description = "Portable evaluation contract and runners for the LIBERO-VPro benchmark"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
libero-vpro = "libero_vpro.cli:main"

[tool.setuptools.packages.find]
include = ["libero_vpro*"]
