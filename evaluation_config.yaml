schema_version: libero_vpro.evaluation_config.v1

release:
  paper_manifest: PAPER_FACING_SETTINGS.json
  statistics_manifest: PAPER_FACING_STATISTICS.json
  settings_index: runnable_settings/index.json

# LIBERO is external. Model-specific runtime variables belong to adapters.
external:
  sim_root: "${LIBERO_VPRO_SIM_ROOT:-}"
  libero_root: "${LIBERO_VPRO_LIBERO_ROOT:-}"
  libero_assets_root: "${LIBERO_VPRO_LIBERO_ASSETS_ROOT:-}"
  data_root: "${LIBERO_VPRO_DATA_ROOT:-}"
  bddl_subdir: bddl_files
  init_subdir: init_files

evaluation:
  # Without --suite, run all suites declared by the selected setting.
  default_suite: null
  trials_per_case: 10
  output_root: "${LIBERO_VPRO_OUTPUT_ROOT:-../Outputs/libero_vpro}"
  default_gpu: "0"
